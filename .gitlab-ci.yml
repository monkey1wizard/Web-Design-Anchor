stages:
  - test
  - release

# `deno` and `git` are the two external tools this project requires on PATH.
# See docs/development.md. Both legs install it before `cargo test`, because
# the type-check and transpile steps shell out to the real binary and their
# tests fail (not skip) when it is absent.
#
# Deno is intentionally unpinned here (Owner ruling, 2026-09-04): both CI legs
# float. `.github/workflows/ci.yml` floats within the 2.x range via
# `denoland/setup-deno`. This file installs whatever `release-latest.txt` points
# at, because deno.land/install.sh takes a literal release tag and resolves no
# semver range, and no 2.x channel file exists. The residual difference is the
# Deno 3 boundary: this leg will follow into 3.x, the GitHub leg will not.

test:linux:
  stage: test
  image: rust:latest
  variables:
    # Installs to /usr/local/bin/deno, which is already on PATH.
    DENO_INSTALL: /usr/local
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip
    - curl -fsSL https://deno.land/install.sh | sh
    - deno --version
    - git config --global user.name "WDA CI"
    - git config --global user.email "wda-ci@localhost"
    - git --version
  script:
    - cargo test

test:windows:
  stage: test
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path += ";$env:USERPROFILE\.cargo\bin"
    - $env:DENO_INSTALL = "$env:USERPROFILE\.deno"
    - irm https://deno.land/install.ps1 | iex
    - $env:Path += ";$env:DENO_INSTALL\bin"
    - deno --version
    - git config --global user.name "WDA CI"
    - git config --global user.email "wda-ci@localhost"
    - git --version
  script:
    - cargo test

# Owner ruling, 2026-09-05: this job is non-blocking. It calls the real
# npm registry through the real `deno` binary, so a registry outage or
# transient network flake fails the job for reasons the merge has no
# control over. Blocking the merge gate on it would move the flake from
# the test suite (the thing this plan removes it from) onto the gate
# itself, not remove it. `allow_failure: true` keeps the probes running
# and visible without letting third-party availability block a merge.
test:ignored-probes:
  stage: test
  image: rust:latest
  allow_failure: true
  variables:
    # Installs to /usr/local/bin/deno, which is already on PATH.
    DENO_INSTALL: /usr/local
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip
    - curl -fsSL https://deno.land/install.sh | sh
    - deno --version
  script:
    - cargo test -- --ignored

publish-public-release:
  stage: release
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  variables:
    PUBLIC_REPO: "monkey1wizard/web-design-anchor"
    PUBLIC_BRANCH: "main"
  before_script:
    - apk add --no-cache git bash grep findutils coreutils tar
  script:
    - set -euo pipefail
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/${PUBLIC_REPO}.git"
    - |
      if git ls-remote --tags github "refs/tags/${CI_COMMIT_TAG}" | grep -q "${CI_COMMIT_TAG}"; then
        echo "ABORT: tag ${CI_COMMIT_TAG} already exists on the public repo." >&2
        echo "Delete the remote tag manually and re-run — WDA never force-updates a published tag." >&2
        exit 1
      fi
    - bash packaging/publish-public.sh --remote github --branch "${PUBLIC_BRANCH}"
    - bash packaging/publish-public.sh --remote github --branch "${PUBLIC_BRANCH}" --execute
    - |
      git fetch github "${PUBLIC_BRANCH}"
      SHA="$(git rev-parse FETCH_HEAD)"
      if [ -z "$SHA" ]; then
        echo "ABORT: could not resolve public ${PUBLIC_BRANCH} HEAD after push." >&2
        exit 1
      fi
      git push github "${SHA}:refs/tags/${CI_COMMIT_TAG}"
      echo "Pushed ${CI_COMMIT_TAG} -> ${SHA} on the public repo; GitHub Actions release.yml takes over."
