[package]
name = "wda"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "wda_core"
path = "src/lib.rs"

[[bin]]
name = "wda"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "0.51.0", default-features = false }
json-sourcemap = "0.2.0"
marked-yaml = "0.8.0"
html5gum = "0.8.4"
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rolldown = "=1.3.1"
rolldown_common = "=1.3.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
oxc = { version = "=0.157.0", default-features = false, features = ["ast_visit"] }
